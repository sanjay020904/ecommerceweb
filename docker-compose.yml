version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: abc
    ports:
      - "3306:3306"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

  webapp:
    build: .
    container_name: ecommerce_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://mysqldb:3306/abc?useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: "root"
      DB_PASS: "1234"
    depends_on:
      - mysqldb
